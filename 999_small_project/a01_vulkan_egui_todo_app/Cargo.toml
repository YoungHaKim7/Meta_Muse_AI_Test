[package]
name = "a01_vulkan_egui_todo_app"
version = "0.1.0"
edition = "2021"                  # 2024 breaks vulkano 0.35 build scripts

[dependencies]
vulkano = "0.35"
vulkano-shaders = "0.35"
# NO features = ["full"] - it doesn't exist in 0.35
vulkano-util = "0.35"

winit = { version = "0.30", features = ["rwh_06"] }

# Matched set: egui 0.31 + egui_winit_vulkano 0.31 + vulkano 0.35
# This is the last set hakolao officially released
egui = "0.36.2"
egui-winit = "0.36.2"
egui_winit_vulkano = "0.28.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0.0"
anyhow = "1.0"
